spring.application.name=api-management-service

server.port=8081

info.app.name=API Management Service
info.app.description=Enables user to set the basic configuration as per their requirement

spring.datasource.url=jdbc:mysql://localhost:3306/gatekeeper
spring.datasource.username=root
spring.datasource.password=NewPassword@1234


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

logging.level.org.flywaydb=DEBUG

security.jwt.expiration-seconds=3600

security.jwt.secret=gatekeeper-demo-jwt-secret-key-change-before-production